<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실습 프로젝트</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #1a1d23;
        --text: #e6e8eb;
        --muted: #9aa1ab;
        --border: #2a2f37;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 16px 24px;
    }
    header h1 { margin: 0 0 8px; font-size: 1.9rem; }
    header p { margin: 0; color: var(--muted); }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    .card .num {
      font-size: .8rem;
      font-weight: 600;
      color: var(--accent);
    }
    .card h2 { margin: 0; font-size: 1.15rem; }
    .card .badge {
      align-self: flex-start;
      margin-top: auto;
      padding: 4px 10px;
      font-size: .75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .card.disabled { cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>실습 프로젝트</h1>
    <p>junghaewoo7-maker의 실습 자료 모음입니다.</p>
  </header>

  <main>
    <!-- 링크가 준비되면 href="#"를 실제 주소로 바꾸고, class의 disabled와 badge를 지우세요. -->
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">01</span>
      <h2>할일 목록 리스트</h2>
      <span class="badge">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">02</span>
      <h2>클로드 활용 스네이크 게임</h2>
      <span class="badge">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">03</span>
      <h2>개인 프로파일</h2>
      <span class="badge">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">04</span>
      <h2>주식 일기</h2>
      <span class="badge">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">05</span>
      <h2>4축 로봇암 시뮬레이터</h2>
      <span class="badge">준비 중</span>
    </a>
    <a class="card disabled" href="#" aria-disabled="true">
      <span class="num">06</span>
      <h2>이북(ebook) 쇼핑몰</h2>
      <span class="badge">준비 중</span>
    </a>
  </main>

  <script>
    // 준비 중인 카드는 클릭해도 이동하지 않도록 막습니다.
    document.querySelectorAll('.card.disabled').forEach(function (card) {
      card.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>
</html>
